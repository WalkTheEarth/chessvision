<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Define the base pattern: a 2x2 block of 100x100 squares -->
    <pattern id="checkerboard" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Cream background -->
      <rect width="200" height="200" fill="#f1ecd2"/>
      <!-- Green squares -->
      <rect x="0" y="0" width="100" height="100" fill="#7a9a59"/>
      <rect x="100" y="100" width="100" height="100" fill="#7a9a59"/>
    </pattern>
  </defs>

  <!-- Apply the pattern to fill the entire canvas -->
  <rect width="100%" height="100%" fill="url(#checkerboard)"/>
</svg>